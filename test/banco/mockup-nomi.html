<!doctype html><html lang="it"><head><meta charset="utf-8">
<title>mockup — come si scrive un artista</title>
<link rel="stylesheet" href="/css/variables.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Castoro:ital@0;1&display=swap');
  body{margin:0;background:#efe6d4;font-family:'Nunito',sans-serif;padding:12px 14px 30px}
  .tit{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a7248;
       margin:22px 0 4px;display:flex;align-items:center;gap:8px}
  .tit span{background:#f5ecd8;border:1px solid #e0d4b4;border-radius:20px;padding:3px 10px}
  .tit i{flex:1;height:1.5px;background:#dccca0;font-style:normal}
  .nota{font-size:11.5px;color:#8a7248;margin:0 2px 8px;line-height:1.45}

  .carta{position:relative;background:var(--white);border:1.5px solid var(--sand2);border-radius:18px;
         overflow:hidden;box-shadow:0 2px 10px rgba(74,184,216,.08)}
  .carta::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
                 background:linear-gradient(90deg,var(--sand3),var(--gold),var(--sand3))}
  .r{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sand)}
  .r:last-child{border-bottom:none}
  .disco{width:36px;height:36px;border-radius:50%;background:#e2b62c;color:#2a2412;font-size:12.5px;
         font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .nome{flex:1;min-width:0;color:var(--ink)}

  /* oggi: tutto uguale, cognome maiuscolo */
  .oggi .nome{font-size:14.5px;font-weight:700}
  .oggi .c{text-transform:uppercase}
  .oggi .n{margin-left:5px}

  /* A · cognome grassetto, nome leggero */
  .a .nome{font-size:14.5px}
  .a .c{font-weight:800;text-transform:uppercase;letter-spacing:.01em}
  .a .n{font-weight:400;color:var(--ink2);margin-left:6px}

  /* B · cognome spaziato, nome piu' piccolo e chiaro */
  .b .nome{font-size:14.5px}
  .b .c{font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .b .n{font-weight:600;font-size:12.5px;color:var(--ink3);margin-left:8px}

  /* C · due righe: cognome sopra, nome sotto */
  .c2 .nome{line-height:1.2}
  .c2 .c{display:block;font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
  .c2 .n{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px}

  /* D · alla rubrica: "OTOMO, Katsuhiro" */
  .d .nome{font-size:14.5px}
  .d .c{font-weight:800;text-transform:uppercase}
  .d .n{font-weight:400;color:var(--ink2)}
  .d .v{color:var(--sand3);font-weight:400}

  /* E · nome piccolo prima, cognome grande dopo */
  .e .nome{font-size:15px}
  .e .n{font-weight:600;font-size:11.5px;color:var(--ink3);margin-right:7px;
        text-transform:lowercase;letter-spacing:.02em}
  .e .c{font-weight:800;text-transform:uppercase;letter-spacing:.02em}

  /* F · cognome in Castoro, nome in Nunito leggero */
  .f .nome{font-size:15px}
  .f .c{font-family:'Castoro',serif;font-weight:400;font-size:17px;letter-spacing:.01em}
  .f .n{font-weight:400;font-size:13px;color:var(--ink3);margin-left:8px}
</style>
</head><body>
<div id="qui"></div>
<script>
const G = [['KO','Kon','Satoshi'],['OT','Otomo','Katsuhiro'],['TA','Taniguchi','Jiro'],
           ['MO','Moebius',''],['ZI','Zini','Luca']];
const riga = (virgola)=> G.map(([s,c,n])=>`
  <div class="r"><span class="disco">${s}</span>
    <span class="nome"><span class="c">${c}</span>${n ? (virgola?'<span class="v">, </span>':'') + '<span class="n">'+n+'</span>' : ''}</span>
  </div>`).join('');
const rigaInv = ()=> G.map(([s,c,n])=>`
  <div class="r"><span class="disco">${s}</span>
    <span class="nome">${n ? '<span class="n">'+n+'</span>' : ''}<span class="c">${c}</span></span>
  </div>`).join('');

const varianti = [
  ['oggi · tutto dello stesso peso', 'Cognome in maiuscolo e nome accanto, stesso corpo e stesso grassetto: la riga è una parola sola lunga.', 'oggi', riga()],
  ['A · cognome grassetto, nome leggero', 'Il cognome resta maiuscolo e diventa più nero; il nome perde il grassetto e si schiarisce di un tono. È la differenza più netta a parità di ingombro.', 'a', riga()],
  ['B · cognome spaziato, nome piccolo', 'Il cognome prende un filo di spaziatura fra le lettere (come le barre di sezione) e il nome scende di corpo: due gerarchie invece di due pesi.', 'b', riga()],
  ['C · su due righe', 'Cognome sopra, nome sotto in piccolo. La riga cresce di qualche pixel ma i cognomi si incolonnano e si scorrono con l\'occhio.', 'c2', riga()],
  ['D · alla rubrica telefonica', '"OTOMO, Katsuhiro": la virgola dice che il cognome viene prima per ordinare, non perché si chiami così.', 'd', riga(true)],
  ['E · nome piccolo, poi il cognome', '"katsuhiro OTOMO": si legge nell\'ordine naturale, ma a pesare è il cognome.', 'e', rigaInv()],
  ['F · cognome in Castoro', 'Il cognome nel carattere del marchio, il nome in Nunito leggero. Il più caratterizzato — e il più rischioso su un elenco lungo.', 'f', riga()],
];
document.getElementById('qui').innerHTML = varianti.map(([t,n,cl,corpo])=>
  `<div class="tit"><span>${t}</span><i></i></div><div class="nota">${n}</div>
   <div class="carta ${cl}">${corpo}</div>`).join('');
</script>
</body></html>
