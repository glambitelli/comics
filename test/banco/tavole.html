<!doctype html><html lang="it"><head><meta charset="utf-8">
<title>banco di prova — i due scaffali di una cartella</title>
<!-- Come il banco della galleria: js/refs.js e js/dialogs.js sono QUELLI VERI,
     finti solo Firestore, Drive, Cloudinary e la compressione. La differenza è
     che qui si inietta l'INTERA schermata References di index.html — servono i
     tab, la griglia, la barra di ricerca e gli stati vuoti, non solo la
     lightbox. Anche qui il markup si prende dal file vero: una copia
     invecchierebbe da sola. -->
<script type="importmap">
{ "imports": {
  "/js/firebase.js":    "/test/finti/firebase.js",
  "/js/state.js":       "/test/finti/state.js",
  "/js/imgcompress.js": "/test/finti/imgcompress.js",
  "/js/cloudinary.js":  "/test/finti/cloudinary.js",
  "/js/drive.js":       "/test/finti/drive.js"
} }
</script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/modals.css">
<link rel="stylesheet" href="/css/refs.css">
<link rel="stylesheet" href="/css/layout.css">
<style>html,body{margin:0;height:100%;background:#111}
/* Nell'app la schermata attiva la mostra main.js: qui non c'è, e senza questo
   la si misurerebbe mentre è ancora nascosta (tutte le altezze a zero). */
#screen-refs{display:flex;flex-direction:column;height:100%}</style>
</head><body>
<script type="module">
const html = await (await fetch('/index.html')).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
document.body.appendChild(document.importNode(doc.getElementById('screen-refs'), true));
document.body.appendChild(document.importNode(doc.getElementById('refs-lightbox'), true));
// Il pannello "Riferimenti" della scheda progetto: serve a verificare che una
// TAVOLA collegata a un progetto ci compaia come qualsiasi altro ritaglio.
document.body.appendChild(document.importNode(doc.getElementById('ref-panel'), true));

const refs = await import('/js/refs.js');
window.refs = refs;
// Gli onclick inline dei tab chiamano un globale: nell'app lo mette main.js.
['setFolderTab','refsBackToFolders','refsGridSearch','refsImageMenu',
 'openRefLightbox','closeRefLightbox','deleteRefImageWithUndo',
 'promptLinkProjectFromLightbox','toggleRefsProfile','closeRefsProfile'].forEach(n=>{
  window[n] = (...a)=> Promise.resolve(refs).then(m=> m[n] && m[n](...a));
});

// Una cartella con dentro un po' di tutto. Le immagini sono canvas minuscoli
// trasformati in data URL: la griglia le carica davvero, senza rete.
// Le tavole sono FATTE A PAGINA (7:10) e i ritagli quadrotti: la forma conta,
// è quella che la griglia deve rispettare invece di ritagliarla.
window.semina = (ritagli, tavole)=>{
  const foto = (pre, n, tav) => Array.from({length:n},(_,i)=>{
    const c = document.createElement('canvas');
    // Le tavole NON hanno tutte la stessa forma: una pagina di manga (0,66),
    // una di albo americano (0,70) e una doppia splash orizzontale (1,40).
    // È proprio la differenza che faceva comparire i filetti di fondo ai lati.
    const forme = [[66,100],[70,100],[140,100]];
    const f = forme[i % forme.length];
    c.width = tav ? f[0] : 40; c.height = tav ? f[1] : 40;
    const x = c.getContext('2d');
    x.fillStyle = '#f4ecdc'; x.fillRect(0,0,c.width,c.height);
    // Qualche vignetta, così a occhio si vede se la miniatura taglia in alto o
    // in basso: le strisce agli estremi sono la prova visiva.
    x.fillStyle = tav ? '#c05a3a' : '#2a6aa0';
    x.fillRect(3,3,c.width-6,c.height*0.3);
    x.fillRect(3,c.height*0.66,c.width-6,c.height*0.31);
    return { id:pre+i, url:c.toDataURL('image/png'), projectIds:[], projectId:null,
             folderId:'F1', tavola:tav, source:'clip', w:c.width, h:c.height,
             provenance:{ opera:'Akira', pagina:i+1, folderId:'F1' } };
  });
  const arr = refs.getRefs(); arr.length = 0;
  arr.push(...foto('r', ritagli, false), ...foto('t', tavole, true));
  const cart = refs.getFolders(); cart.length = 0;
  cart.push({ id:'F1', category:'Artists', name:'OTOMO' });
  window.__projects.length = 0;
  window.__projects.push({ id:'p1', title:'Il Sentiero', color:'#4ab8d8' });
};
window.vociMenu = ()=> Array.from(document.querySelectorAll('.ink-action-menu button')).map(b=>b.textContent);
window.chiudiMenu = ()=> document.dispatchEvent(new MouseEvent('click',{bubbles:true}));
window.__ready = true;
</script>
</body></html>
