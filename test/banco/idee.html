<!doctype html><html lang="it"><head><meta charset="utf-8">
<title>banco di prova — idee</title>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/idee.css">
<!-- il menu contestuale e il toast di annullamento vivono qui -->
<link rel="stylesheet" href="/css/modals.css">
<link rel="stylesheet" href="/css/layout.css">
<script type="importmap">
{ "imports": {
  "/js/firebase.js": "/test/finti/firebase.js",
  "/js/state.js":    "/test/finti/state.js"
} }
</script>
</head><body>
<script type="module">
// Il markup della schermata e dell'editor si PRENDE da index.html invece di
// riscriverlo: se domani cambia lì, la prova lo segue. Una copia a mano
// direbbe che tutto funziona su una schermata che non esiste più.
const dom = new DOMParser().parseFromString(await (await fetch('/index.html')).text(), 'text/html');
for(const sel of ['#screen-idee', '#idea-editor']){
  const el = dom.querySelector(sel);
  document.body.appendChild(document.importNode(el, true));
}
document.getElementById('screen-idee').classList.add('active');

const idee = await import('/js/idee.js');
window.idee = idee;
idee.initIdee();

// IL TASTO INDIETRO. Nell'app lo tiene main.js, che qui non c'e': senza questo
// pezzo l'editor non si chiuderebbe mai — la sua freccia passa apposta dalla
// cronologia, cosi' il tasto del telefono e quello a schermo fanno la stessa
// identica cosa (col dito la freccia non c'e' proprio).
addEventListener('popstate', ()=>{
  const ov = document.getElementById('idea-editor');
  if(ov && ov.classList.contains('open')) idee.chiudiEditor();
});
window.__ready = true;
</script>
</body></html>
