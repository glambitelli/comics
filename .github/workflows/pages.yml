# Pubblicazione del sito su GitHub Pages.
#
# PERCHÉ ESISTE QUESTO FILE, E PERCHÉ NON USA actions/deploy-pages.
#
# Il 6 agosto la coda di Pages ha rallentato progressivamente — 41s il giorno
# prima, poi 5m05s, poi 6m48s — finché ha superato i dieci minuti. Dieci minuti
# è il tempo che actions/deploy-pages aspetta prima di arrendersi, e allo
# scadere non si limita a fallire: ANNULLA il deployment. Da quel momento
# nessuna pubblicazione poteva più atterrare, qualunque commit si spingesse:
# ogni tentativo veniva ucciso mentre stava semplicemente aspettando il proprio
# turno.
#
# Il primo rimedio tentato — alzare il timeout dell'azione a mezz'ora — non
# funziona, e vale la pena ricordarlo qui perché il parametro esiste e sembra
# accettato. Dentro l'azione c'è:
#
#     this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)   // MAX_TIMEOUT = 600000
#
# cioè i dieci minuti sono un tetto invalicabile: qualsiasi valore più alto
# viene troncato in silenzio. Non è una configurazione, è un limite.
#
# Quindi qui il deployment lo creiamo da soli, con la stessa identica chiamata
# che farebbe l'azione, e poi NON LO ANNULLIAMO. Se la coda è lenta il
# deployment ci mette il tempo che ci mette, ma arriva in fondo per conto suo:
# nessuno lo uccide più a metà strada. Il workflow riferisce lo stato per
# qualche minuto e poi si fa da parte, senza toccare nulla.
name: Deploy sito

on:
  push:
    branches: [main]
  # Permette di rilanciare la pubblicazione a mano, senza dover inventare un
  # commit vuoto solo per farlo (Actions → Deploy sito → Run workflow).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta. cancel-in-progress resta FALSE apposta: se la coda è
# lenta, un deploy già in viaggio sta solo aspettando il suo turno — annullarlo
# per far partire il successivo lo rimetterebbe in fondo, ed è esattamente il
# circolo vizioso da cui veniamo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara i file da pubblicare
        # Si copia tutto tranne le voci che iniziano con punto (.git,
        # .github, .claude…): sono roba di sviluppo, e non venivano
        # pubblicate nemmeno prima, perché Jekyll le escludeva per
        # impostazione predefinita. Il sito servito resta identico.
        run: |
          mkdir -p _site
          # `*` non espande le voci che iniziano con punto: è proprio il
          # comportamento voluto, e coincide con quello che Jekyll faceva
          # prima. Niente extglob, che nei blocchi `run` non è affidabile.
          #
          # Fuori anche le prove automatiche e ciò che le fa girare: sono
          # megabyte di banco di lavoro (albi .cbz generati, un Chromium
          # pilotato) che il telefono scaricherebbe senza motivo, e il service
          # worker mette in cache tutto quello che trova.
          for f in *; do
            case "$f" in
              _site|test|package.json|package-lock.json|node_modules) continue ;;
            esac
            cp -R "$f" _site/
          done
          # Dice a Pages di servire i file così come sono, senza passarli per
          # Jekyll: è un'app statica, non c'è niente da compilare.
          touch _site/.nojekyll
          ls -la _site

      - name: Controlla che a pubblicare sia UN impianto solo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A COSA SERVE QUESTO CONTROLLO.
          #
          # Se la sorgente di Pages nelle impostazioni del repository è rimasta
          # "Deploy from a branch", ad ogni push GitHub lancia DA SOLO anche il
          # suo workflow "pages build and deployment" — il builder Jekyll — che
          # pubblica lo stesso sito per conto proprio. Due impianti che
          # deployano nello stesso posto prima o poi si pestano i piedi, e l'11
          # agosto è successo: quello automatico ha provato a pubblicare
          # d552967 mentre questo aveva già a42145c in corso, e l'API ha
          # risposto
          #   400 — due to in progress deployment. Please cancel a42145c first.
          # Da lì la mail "Run failed: pages build and deployment". Il sito era
          # aggiornato lo stesso: a pubblicarlo era stato il workflow che aveva
          # vinto la corsa, e il fallimento riguardava il doppione che l'aveva
          # persa. Stessa cosa in forma più silenziosa su 79b3f27, dove il
          # doppione era finito "cancelled" invece che "failure".
          #
          # PERCHÉ QUI NON SI PUÒ RIMEDIARE DA SOLI.
          #
          # Spostare la sorgente vuol dire PUT /repos/{owner}/{repo}/pages, che
          # richiede i permessi di AMMINISTRATORE del repository. Il token di
          # Actions ha `pages: write`, che basta a creare deployment ma non a
          # toccare le impostazioni: provato, risponde 403. È anche il motivo
          # per cui `actions/configure-pages` con `enablement: true` (qui sotto)
          # non l'ha mai spostata davvero — fallisce in silenzio. Quindi qui ci
          # si limita a dirlo, una riga sola e solo quando serve: il rimedio è
          # un clic umano, non qualcosa che si possa automatizzare da dentro.
          #
          # E NON SI PUÒ NEMMENO METTERLO IN PAUSA. Provato il 17 agosto: si
          # aggiunge `actions: write`, si trova il doppione fra i workflow (sta
          # in "dynamic/pages/pages-build-deployment", quindi si riconosce dal
          # percorso senza rischiare di spegnere questo) e gli si manda
          #   PUT /repos/{owner}/{repo}/actions/workflows/{id}/disable
          # La risposta è 422. Quel workflow non è un file del repository: è
          # generato da Pages e vive finché la sorgente è un branch, quindi
          # l'endpoint che accende e spegne i workflow non lo tocca. Vicolo
          # cieco: sta scritto qui perché non ci si riprovi.
          TIPO=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            | jq -r '.build_type // "sconosciuta"')
          echo "sorgente di Pages: $TIPO"
          if [ "$TIPO" != "workflow" ]; then
            echo "::warning::A pubblicare sono in due: oltre a questo workflow gira anche" \
                 "'pages build and deployment' di GitHub, e ogni tanto si scontrano (mail di run" \
                 "fallita, sito comunque aggiornato). Si spegne del tutto cambiando Impostazioni →" \
                 "Pages → Build and deployment → Source in 'GitHub Actions'. Serve un permesso da" \
                 "amministratore: da qui non si può fare."
          fi

      - uses: actions/configure-pages@v5
        with:
          # Sposta da solo la sorgente di Pages su "GitHub Actions", via API,
          # usando il permesso `pages: write` qui sopra. Senza questo il passo
          # di deploy non troverebbe il sito, perché il repository era
          # configurato in modalità "Deploy from a branch" — quella con il
          # workflow automatico e il timeout fisso che ci ha bloccati.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Crea il deployment (e non annullarlo mai)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1) Token OIDC. Stessa chiamata che fa actions/deploy-pages tramite
          #    core.getIDToken(): nessuna audience, quella predefinita va bene.
          #    Serve il permesso id-token: write dichiarato sopra.
          IDTOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          # Fuori dai log, in ogni caso: è una credenziale a tutti gli effetti.
          echo "::add-mask::$IDTOKEN"
          test -n "$IDTOKEN" && test "$IDTOKEN" != "null"

          # 2) L'artefatto caricato dal job "build". I due job condividono
          #    GITHUB_RUN_ID, quindi si ritrova dall'elenco di questa esecuzione.
          ART=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | jq -r 'first(.artifacts[] | select(.name=="github-pages") | .id)')
          test -n "$ART" && test "$ART" != "null"
          echo "artefatto github-pages: id $ART"

          # 3) Creazione del deployment: POST /repos/{owner}/{repo}/pages/deployments
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
            -d "$(jq -nc --argjson art "$ART" --arg ver "$GITHUB_SHA" --arg tok "$IDTOKEN" \
                  '{artifact_id:$art, pages_build_version:$ver, oidc_token:$tok}')")
          echo "$RESP" | jq 'del(.oidc_token)'
          echo "$RESP" | jq -e '.status_url' > /dev/null \
            || { echo "::error::Creazione del deployment fallita"; exit 1; }
          echo "$RESP" | jq -r '.status_url' > /tmp/status_url
          echo "Deployment creato. Da qui in poi va avanti da solo."

      - name: Riferisci lo stato (senza mai interromperlo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          URL=$(cat /tmp/status_url)
          # Si guarda per qualche minuto solo per lasciare traccia nei log.
          # Se al termine non è ancora finito NON si annulla e NON si fallisce:
          # il deployment prosegue lato GitHub e il sito si aggiorna da sé.
          # È esattamente il passo che prima ci uccideva la pubblicazione.
          for i in $(seq 1 40); do
            S=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" "$URL" | jq -r '.status')
            echo "stato: $S"
            case "$S" in
              succeed|succeeded)
                echo "✅ Sito pubblicato."; exit 0 ;;
              error|failed|deployment_failed|deployment_content_failed|deployment_cancelled)
                echo "::error::Deployment fallito: $S"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::notice::Ancora in corso dopo 10 minuti. Lo si lascia proseguire:" \
               "arriverà in fondo da solo, senza bisogno di un altro tentativo."
